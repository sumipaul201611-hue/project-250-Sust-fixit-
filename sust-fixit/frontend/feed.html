<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed — SUST FixIt</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-slot"></div></header>

<div class="wrap" style="padding-top:32px">
  <div class="section-head">
    <h2>Community feed</h2>
  </div>

  <div class="filters">
    <select id="f-sort">
      <option value="new">Newest</option>
      <option value="upvotes">Most upvoted</option>
    </select>
    <select id="f-status">
      <option value="">All statuses</option>
      <option value="reported">Reported</option>
      <option value="verified">Verified</option>
      <option value="in_progress">In progress</option>
      <option value="resolved">Resolved</option>
    </select>
    <select id="f-category"><option value="">All categories</option></select>
    <select id="f-building"><option value="">All buildings</option></select>
    <input type="text" id="f-q" placeholder="Search title or location…">
    <div class="spacer"></div>
    <a href="report.html" class="btn btn-amber btn-sm">+ Report a problem</a>
  </div>

  <div class="report-grid" id="grid"><p>Loading…</p></div>

  <div style="text-align:center; margin:28px 0">
    <button class="btn btn-ghost hidden" id="load-more">Load more</button>
  </div>
</div>

<footer class="site"><div class="wrap">SUST FixIt — a student web-technology course project.</div></footer>

<script src="js/api.js"></script>
<script src="js/feed-card.js"></script>
<script>
renderNav('feed.html');

const PAGE_SIZE = 12;
let offset = 0;
let loading = false;

function currentParams(){
  const p = new URLSearchParams();
  p.set('sort', document.getElementById('f-sort').value);
  const status = document.getElementById('f-status').value;
  const category = document.getElementById('f-category').value;
  const building = document.getElementById('f-building').value;
  const q = document.getElementById('f-q').value.trim();
  if (status) p.set('status', status);
  if (category) p.set('category', category);
  if (building) p.set('building', building);
  if (q) p.set('q', q);
  p.set('limit', PAGE_SIZE);
  return p;
}

async function loadPage(reset){
  if (loading) return;
  loading = true;
  const grid = document.getElementById('grid');
  const loadMoreBtn = document.getElementById('load-more');
  if (reset) { offset = 0; grid.innerHTML = '<p>Loading…</p>'; }
  const params = currentParams();
  params.set('offset', offset);
  try {
    const { reports, total } = await API.get('/api/reports?' + params.toString());
    if (reset) grid.innerHTML = '';
    if (offset === 0 && reports.length === 0) {
      grid.innerHTML = '<div class="empty">No problems match these filters yet.</div>';
    } else {
      const html = reports.map(renderReportCard).join('');
      grid.insertAdjacentHTML('beforeend', html);
      attachUpvoteHandlers(grid);
    }
    offset += reports.length;
    loadMoreBtn.classList.toggle('hidden', offset >= total || reports.length === 0);
  } catch (e) {
    grid.innerHTML = `<div class="empty">Could not load the feed: ${escapeHtml(e.message)}</div>`;
  } finally {
    loading = false;
  }
}

(async function init(){
  try {
    const meta = await API.get('/api/meta');
    const catSel = document.getElementById('f-category');
    meta.categories.forEach(c => catSel.insertAdjacentHTML('beforeend', `<option value="${c}">${c}</option>`));
    const bldSel = document.getElementById('f-building');
    meta.buildings.forEach(b => bldSel.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`));
  } catch(e) { /* filters still usable without meta */ }

  ['f-sort','f-status','f-category','f-building'].forEach(id =>
    document.getElementById(id).addEventListener('change', () => loadPage(true)));
  let qTimer;
  document.getElementById('f-q').addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => loadPage(true), 350);
  });
  document.getElementById('load-more').addEventListener('click', () => loadPage(false));

  loadPage(true);
})();
</script>
</body>
</html>
