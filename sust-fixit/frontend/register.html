<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — SUST FixIt</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-slot"></div></header>

<div class="center-page">
  <div class="wrap">
    <h1 class="page-title">Create your account</h1>
    <div class="panel">
      <div id="alert-slot"></div>
      <form id="register-form">
        <div class="grid-2">
          <div class="field">
            <label for="student_id">Student ID</label>
            <input type="text" id="student_id" required placeholder="2021331001">
          </div>
          <div class="field">
            <label for="department">Department</label>
            <input type="text" id="department" placeholder="CSE">
          </div>
        </div>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required placeholder="Your name">
        </div>
        <div class="field">
          <label for="email">University email</label>
          <input type="email" id="email" required placeholder="yourid@student.sust.edu">
          <div class="hint" id="domain-hint"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="8" maxlength="72">
          <div class="hint">At least 8 characters.</div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Sign up</button>
      </form>
      <p class="small-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
renderNav('register.html');
if (API.isLoggedIn()) window.location.href = 'feed.html';

API.get('/api/meta').then(() => {}).catch(() => {});

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const alertSlot = document.getElementById('alert-slot');
  alertSlot.innerHTML = '';
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const res = await API.postJSON('/api/auth/register', {
      student_id: document.getElementById('student_id').value.trim(),
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      department: document.getElementById('department').value.trim(),
    });
    API.setSession(res.token, res.user);
    window.location.href = 'feed.html';
  } catch (err) {
    alertSlot.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    btn.disabled = false; btn.textContent = 'Sign up';
  }
});
</script>
</body>
</html>
