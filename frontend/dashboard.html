<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My reports — SUST FixIt</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-slot"></div></header>

<div class="wrap" style="padding-top:32px">
  <div class="section-head"><h2>My reports</h2><a href="report.html" class="btn btn-amber btn-sm">+ Report a problem</a></div>
  <div id="submitted-alert"></div>
  <div id="list"><p>Loading…</p></div>
</div>

<footer class="site"><div class="wrap">SUST FixIt — small reports, real fixes, together.</div></footer>

<script src="js/api.js"></script>
<script src="js/feed-card.js"></script>
<script>
requireLogin();
renderNav('dashboard.html');

const STEPS = ['reported','verified','in_progress','resolved'];

function timelineHtml(status){
  const idx = STEPS.indexOf(status);
  return `<div class="timeline">${STEPS.map((s,i) =>
    `<div class="step ${i <= idx ? 'done' : ''}">${STATUS_LABEL[s]}</div>`).join('')}</div>`;
}

function myCard(r){
  const m = categoryMeta(r.category);
  return `
  <article class="card" style="flex-direction:row; --cat-color:${m.color}" data-id="${r.id}">
    ${thumbHtml(r, 'width:180px; flex:0 0 180px; aspect-ratio:auto;')}
    <div class="body" style="flex:1">
      <h3>${escapeHtml(r.title)}</h3>
      <div class="meta"><span>${categoryChip(r.category)}</span><span class="dot">${escapeHtml(r.building)}</span><span class="dot">${escapeHtml(r.location)}</span><span class="dot">${r.upvote_count} upvotes</span></div>
      ${timelineHtml(r.status)}
      <div class="foot">
        <span class="meta">Reported ${timeAgo(r.created_at)}</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="btn btn-ghost btn-sm" onclick="openIssueModal(${r.id})">View Details →</button>
          ${r.status === 'reported' ? `<button class="btn btn-danger btn-sm" data-delete="${r.id}">Delete</button>` : ''}
        </div>
      </div>
    </div>
  </article>`;
}

async function load(){
  const list = document.getElementById('list');
  try {
    const { reports } = await API.get('/api/reports?mine=1&sort=new&limit=50');
    if (!reports.length) {
      list.innerHTML = '<div class="empty">You haven\'t reported anything yet. <a href="report.html">Report your first problem →</a></div>';
      return;
    }
    list.innerHTML = `<div style="display:flex; flex-direction:column; gap:16px">${reports.map(myCard).join('')}</div>`;
    list.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this report?')) return;
        try {
          await API.del(`/api/reports/${btn.dataset.delete}`);
          load();
        } catch (e) { alert(e.message); }
      });
    });
  } catch (e) {
    list.innerHTML = `<div class="empty">Could not load your reports: ${escapeHtml(e.message)}</div>`;
  }
}

const params = new URLSearchParams(location.search);
if (params.get('submitted')) {
  document.getElementById('submitted-alert').innerHTML =
    '<div class="alert alert-ok">Report submitted — thanks for helping fix the campus.</div>';
}

load();
</script>
</body>
</html>
