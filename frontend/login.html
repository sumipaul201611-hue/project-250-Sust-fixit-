<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SUST FixIt</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-slot"></div></header>

<div class="center-page">
  <div class="wrap">
    <h1 class="page-title">Log in</h1>
    <div class="panel">
      <div id="alert-slot"></div>
      <form id="login-form">
        <div class="field">
          <label for="email">University email or Student ID</label>
          <input type="text" id="email" required placeholder="yourid@student.sust.edu or 2023331060">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="8">
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Log in</button>
      </form>
      <p class="small-link">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
renderNav('login.html');
if (API.isLoggedIn()) window.location.href = 'feed.html';

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const alertSlot = document.getElementById('alert-slot');
  alertSlot.innerHTML = '';
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const res = await API.postJSON('/api/auth/login', {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    API.setSession(res.token, res.user);
    const params = new URLSearchParams(location.search);
    window.location.href = params.get('next') || 'feed.html';
  } catch (err) {
    alertSlot.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    btn.disabled = false; btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
